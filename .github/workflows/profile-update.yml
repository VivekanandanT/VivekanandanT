name: Update profile assets

on:
  schedule:
    - cron: "30 18 * * *" # daily 18:30 UTC = 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATS_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=%237C3AED&color_dots=%23E2E8F0,%23BAE6FD,%2338BDF8,%230EA5E9,%230369A1
            profile/snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%231B2540,%23155E75,%230EA5E9,%2338BDF8,%23A3E635

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ env.STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&bg_color=0D1322&title_color=38BDF8&text_color=E6EDF7&icon_color=A78BFA&border_color=1B2540
          path: profile/stats.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&bg_color=0D1322&title_color=38BDF8&text_color=E6EDF7&border_color=1B2540
          path: profile/top-langs.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&background=0D1322&border=1B2540&stroke=1B2540&ring=38BDF8&fire=A3E635&currStreakNum=E6EDF7&currStreakLabel=38BDF8&sideNums=E6EDF7&sideLabels=94A3B8&dates=94A3B8
          path: profile/streak.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
